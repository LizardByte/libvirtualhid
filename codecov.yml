---
# The hosted coverage matrix does not collect coverage from the root-owned
# broker or its IPC client, and cannot exercise signed virtual HID creation.
# The macOS broker CI job tests IPC and licensing behavior separately.
ignore:
  - "src/platform/macos/broker/io.hpp"
  - "src/platform/macos/broker/libvirtualhid_macos_broker.cpp"
  - "src/platform/macos/broker/license_cli.cpp"
  - "src/platform/macos/macos_broker_client.cpp"
